<!DOCTYPE html>

<head>

    <title>南院沙龍報到查詢</title>
    <style>
        /* 移除瀏覽器預設邊距，並隱藏滾動條（防止出現雙滾動條） */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #ffffff;
        }

        /* 讓 iframe 絕對定位，並填滿整個視窗 */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none; /* 移除外框線 */
            display: block;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <!-- 部署 GAS 網頁應用程式網址 -->

            src="https://script.google.com/macros/s/AKfycbwBEhsEeBRgleph_rEdRrbxU67gK5k0D9_tbDCf9NR0Y3aIsicysCX1M8m9Dn-9BDqwbQ/exec" 
            width="600" 
            height="400">
        </iframe>
    </div>

</body>
</html>
