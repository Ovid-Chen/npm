<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南院沙龍報到查詢</title>
    <style>
        /* 移除瀏覽器預設邊距，並隱藏滾動條（防止出現雙滾動條） */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #ffffff;
        }

        /* 讓 iframe 絕對定位，並填滿整個視窗 */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none; /* 移除外框線 */
            display: block;
        }

        .responsive-iframe-modern {
          width: 100%;
          height: auto; /* 確保高度依比例自適應 height: auto;*/
          aspect-ratio: 16 / 9; /* 自動保持 16:9 比例，可依需求改為 4/3 或 1/1 */
          /* max-width: 800px; 可選：限制最大寬度，避免在電腦大螢幕上過大 */
          display: block;
        }

    </style>
</head>
<body>
    <iframe  src="https://youtube.com" ></iframe>

    <div class="iframe-container">
        <!-- 部署 GAS 網頁應用程式網址 -->
        <iframe 
            class="responsive-iframe-modern" 
            src="https://script.google.com/macros/s/AKfycbwBEhsEeBRgleph_rEdRrbxU67gK5k0D9_tbDCf9NR0Y3aIsicysCX1M8m9Dn-9BDqwbQ/exec" 
            frameborder="0" allowfullscreen 
            >
        </iframe>
    </div>

</body>
</html>
